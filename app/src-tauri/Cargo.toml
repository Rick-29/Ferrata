[package]
name = "ferra-visualizer"
version = "0.1.0"
edition = "2024"
description = "Ferra Visualizer: Swissquote compliance desktop app over Ferra chain files"
default-run = "ferra-visualizer"

# Standalone package: the Swissquote backend workspace stays untouched, we depend on its crates by path.
[workspace]

[lib]
name = "ferra_visualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

sq-adapters = { path = "../../backend/sq-adapters" }
sq-connectors = { path = "../../backend/sq-connectors" }
sq-conn-ton = { path = "../../backend/sq-conn-ton" }
sq-conn-evm = { path = "../../backend/sq-conn-evm" }
sq-conn-btc = { path = "../../backend/sq-conn-btc" }
sq-conn-sol = { path = "../../backend/sq-conn-sol" }
wallet-core = { path = "../../backend/wallet-core" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
alloy-primitives = { version = "1", features = ["serde"] }
ed25519-dalek = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Signature and hash arithmetic must stay at full speed: at opt-level "z" / "s" an Ed25519 verify
# costs ~2.7 ms instead of ~50 µs, which made replaying a 500-block chain take seconds.
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.p256]
opt-level = 3
[profile.release.package.ecdsa]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
[profile.release.package.primeorder]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.sha3]
opt-level = 3
[profile.release.package.keccak]
opt-level = 3
[profile.release.package.alloy-primitives]
opt-level = 3

# Same for dev builds (`cargo test`, `tauri dev`): replaying a chain must not take seconds there either.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.alloy-primitives]
opt-level = 3
