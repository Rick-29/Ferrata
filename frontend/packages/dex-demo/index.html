<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DEX demo (Base Sepolia)</title>
    <style>
      :root { --bg: #f6f6f7; --card: #fff; --ink: #1c1c1f; --muted: #6b6b75; --accent: #e3001b; --ok: #1a7f37; --bad: #b42318; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
      main { max-width: 640px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; color: var(--muted); }
      section { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px #0001; }
      h2 { font-size: 15px; margin: 0 0 12px; }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #d0d0d6; background: #fff; cursor: pointer; margin: 0 8px 8px 0; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: .5; cursor: default; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
      li img { width: 24px; height: 24px; border-radius: 6px; }
      pre { background: #111; color: #e6e6e6; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; min-height: 60px; margin: 0; white-space: pre-wrap; }
      .ok { color: var(--ok); } .bad { color: var(--bad); }
    </style>
  </head>
  <body>
    <main>
      <h1>DEX demo · Base Sepolia</h1>
      <p class="sub">Page de test pour le provider de Swissquote Wallet (EIP-6963 / EIP-1193). Testnet uniquement.</p>

      <section>
        <h2>1. Wallets détectés (EIP-6963)</h2>
        <ul id="wallets"><li>Recherche…</li></ul>
      </section>

      <section>
        <h2>2. Actions</h2>
        <button id="connect" class="primary" disabled>Connecter</button>
        <button id="chain" disabled>Chain ID</button>
        <button id="balance" disabled>Solde ETH</button>
        <button id="switch-mainnet" disabled>Passer sur Ethereum (doit être refusé)</button>
        <button id="send" disabled>Envoyer une transaction (pas encore géré)</button>
      </section>

      <section>
        <h2>Journal</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
